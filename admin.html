<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Online | Administração SaaS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#101827;
  color:#fff;
}
.container{
  width:min(1100px,94%);
  margin:40px auto;
}
.login{
  max-width:400px;
  margin:100px auto;
  background:#1c293b;
  padding:30px;
  border-radius:15px;
}
h1{margin-top:0;color:#e9b949}
input{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #40516a;
  border-radius:8px;
  background:#101827;
  color:white;
}
button{
  padding:12px 18px;
  border:0;
  border-radius:8px;
  background:#d9a52e;
  color:#172235;
  font-weight:bold;
  cursor:pointer;
}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:wait}
.hidden{display:none!important}
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:15px;
  margin-bottom:30px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:18px;
}
.card{
  background:#1c293b;
  padding:25px;
  border-radius:13px;
  border:1px solid #304057;
}
.card small{color:#aebbd0}
.number{
  font-size:34px;
  font-weight:bold;
  margin-top:12px;
  color:#e9b949;
}
.message{
  margin-top:15px;
  color:#ffb4a9;
  font-size:14px;
}
.section{
  margin-top:35px;
  background:#1c293b;
  border:1px solid #304057;
  border-radius:13px;
  padding:22px;
}
.section-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  margin-bottom:15px;
}
.section-header h2{margin:0}
.search{
  max-width:400px;
  margin:10px 0 18px;
}
.table-wrap{
  overflow-x:auto;
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}
th,td{
  padding:14px 12px;
  text-align:left;
  border-bottom:1px solid #304057;
  font-size:14px;
}
th{color:#e9b949}
td{color:#e0e7f0}
.empty{
  padding:25px;
  text-align:center;
  color:#aebbd0;
}
</style>
</head>

<body>

<div id="loginScreen" class="login">
  <h1>STAR ONLINE</h1>
  <p>Administração SaaS</p>

  <form id="loginForm">
    <input id="email" type="email"
      placeholder="E-mail" required>

    <input id="password" type="password"
      placeholder="Senha" required>

    <button id="loginButton" type="submit">
      Entrar no painel
    </button>
  </form>

  <div id="loginMessage" class="message"></div>
</div>

<div id="dashboard" class="container hidden">

  <div class="header">
    <div>
      <h1>STAR ONLINE SaaS</h1>
      <small>Painel administrativo do proprietário</small>
    </div>

    <button id="logoutButton">Sair</button>
  </div>

  <h2>Visão geral</h2>

  <div class="grid">

    <div class="card">
      <small>Empresas cadastradas</small>
      <div id="totalEmpresas" class="number">--</div>
    </div>

    <div class="card">
      <small>Assinaturas</small>
      <div id="totalAssinaturas" class="number">--</div>
    </div>

    <div class="card">
      <small>Membros cadastrados</small>
      <div id="totalMembros" class="number">--</div>
    </div>

    <div class="card">
      <small>Planos SaaS</small>
      <div id="totalPlanos" class="number">--</div>
    </div>

  </div>

  <div id="dashboardMessage" class="message"></div>

  <!-- MÓDULO EMPRESAS -->

  <div class="section">

    <div class="section-header">
      <h2>Empresas cadastradas</h2>
      <button id="refreshCompanies">Atualizar lista</button>
    </div>

    <input
      type="text"
      id="companySearch"
      class="search"
      placeholder="Pesquisar empresa ou e-mail..."
    >

    <div class="table-wrap">

      <table>
        <thead>
          <tr>
            <th>Empresa</th>
            <th>E-mail</th>
            <th>Telefone</th>
            <th>Cadastro</th>
          </tr>
        </thead>

        <tbody id="companiesTable">
          <tr>
            <td colspan="4" class="empty">
              Carregando empresas...
            </td>
          </tr>
        </tbody>
      </table>

    </div>

    <div id="companiesMessage" class="message"></div>

  </div>

</div>

<script>
// CONFIGURAÇÃO SUPABASE

const SUPABASE_URL =
'https://hwvrxzgwrimioextcqtl.supabase.co';

const SUPABASE_KEY =
'sb_publishable_ZE2MMH6V7N0Bc2oaMNZ7Eg_dFAd6FE7';

const sb = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);

let empresasCarregadas = [];

function showMessage(message){
  $('loginMessage').textContent = message;
}

// PROTEÇÃO CONTRA HTML INDESEJADO NOS DADOS

function escapeHTML(value){
  return String(value ?? '').replace(/[&<>"']/g, function(char){
    return {
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[char];
  });
}

// CARREGAR INDICADORES

async function loadDashboard(){

  $('dashboardMessage').textContent =
    'Carregando informações...';

  const consultas = await Promise.all([
    sb.from('empresas').select('id', {
      count:'exact', head:true
    }),

    sb.from('assinaturas').select('id', {
      count:'exact', head:true
    }),

    sb.from('membros_empresa').select('id', {
      count:'exact', head:true
    }),

    sb.from('planos_saas').select('id', {
      count:'exact', head:true
    })
  ]);

  const erro = consultas.find(item => item.error);

  if(erro){
    $('dashboardMessage').textContent =
      'Erro ao carregar dados: ' + erro.error.message;
    return;
  }

  $('totalEmpresas').textContent =
    consultas[0].count ?? 0;

  $('totalAssinaturas').textContent =
    consultas[1].count ?? 0;

  $('totalMembros').textContent =
    consultas[2].count ?? 0;

  $('totalPlanos').textContent =
    consultas[3].count ?? 0;

  $('dashboardMessage').textContent =
    'Informações atualizadas com sucesso.';
}

// CARREGAR EMPRESAS

async function loadCompanies(){

  $('companiesTable').innerHTML = `
    <tr>
      <td colspan="4" class="empty">
        Carregando empresas...
      </td>
    </tr>
  `;

  $('companiesMessage').textContent = '';

  const {data,error} = await sb
    .from('empresas')
    .select('id,nome_fantasia,email,telefone,created_at')
    .order('created_at', {ascending:false});

  if(error){

    $('companiesTable').innerHTML = `
      <tr>
        <td colspan="4" class="empty">
          Não foi possível carregar as empresas.
        </td>
      </tr>
    `;

    $('companiesMessage').textContent =
      'Erro: ' + error.message;

    console.error(error);
    return;
  }

  empresasCarregadas = data || [];

  renderCompanies();
}

// MOSTRAR EMPRESAS NA TABELA

function renderCompanies(){

  const pesquisa = $('companySearch').value
    .trim()
    .toLowerCase();

  const filtradas = empresasCarregadas.filter(empresa => {

    const nome = (empresa.nome_fantasia || '').toLowerCase();
    const email = (empresa.email || '').toLowerCase();

    return nome.includes(pesquisa) ||
           email.includes(pesquisa);
  });

  if(filtradas.length === 0){

    $('companiesTable').innerHTML = `
      <tr>
        <td colspan="4" class="empty">
          Nenhuma empresa encontrada.
        </td>
      </tr>
    `;

    return;
  }

  $('companiesTable').innerHTML =
    filtradas.map(empresa => {

      const dataCadastro = empresa.created_at
        ? new Date(empresa.created_at).toLocaleDateString('pt-BR')
        : '-';

      return `
        <tr>
          <td>${escapeHTML(empresa.nome_fantasia || 'Sem nome')}</td>
          <td>${escapeHTML(empresa.email || '-')}</td>
          <td>${escapeHTML(empresa.telefone || '-')}</td>
          <td>${escapeHTML(dataCadastro)}</td>
        </tr>
      `;

    }).join('');
}

// VERIFICAR AUTORIZAÇÃO ADMINISTRATIVA

async function enterAdmin(){

  const {data,error} =
    await sb.rpc('eh_admin_saas');

  if(error){
    showMessage(
      'Não foi possível verificar a autorização administrativa.'
    );
    console.error(error);
    return;
  }

  if(data !== true){
    showMessage(
      'Acesso não autorizado. Esta área é exclusiva do proprietário.'
    );
    return;
  }

  $('loginScreen').classList.add('hidden');
  $('dashboard').classList.remove('hidden');

  await loadDashboard();
  await loadCompanies();
}

// LOGIN

$('loginForm').addEventListener('submit',async function(e){

  e.preventDefault();

  $('loginButton').disabled = true;
  showMessage('Verificando acesso...');

  try{

    const {data,error} =
      await sb.auth.signInWithPassword({
        email:$('email').value,
        password:$('password').value
      });

    if(error){
      showMessage('Falha no login: ' + error.message);
      return;
    }

    await enterAdmin();

  }catch(error){

    showMessage('Erro inesperado: ' + error.message);

  }finally{

    $('loginButton').disabled = false;

  }

});

// PESQUISA

$('companySearch').addEventListener('input',renderCompanies);

// ATUALIZAR LISTA

$('refreshCompanies').addEventListener('click',loadCompanies);

// SAIR

$('logoutButton').addEventListener('click',async function(){

  await sb.auth.signOut();

  $('dashboard').classList.add('hidden');
  $('loginScreen').classList.remove('hidden');

  $('password').value = '';
  $('companySearch').value = '';

  empresasCarregadas = [];

  showMessage('Você saiu do painel.');

});

// VERIFICAR SESSÃO EXISTENTE

async function init(){

  const {data,error} = await sb.auth.getSession();

  if(error){
    showMessage('Erro ao verificar sessão.');
    return;
  }

  if(data.session){
    await enterAdmin();
  }

}

init();
</script>

</body>
</html>
